{# Compteur de la cloche : annoncé aux lecteurs d'écran à chaque mise à jour, interrogé toutes les 60 s (un simple COUNT). #}
<span id="notif-compteur" class="mx-cloche__compteur" aria-live="polite" hx-get="{% url 'notifications-compteur' %}" hx-trigger="every 60s [!document.hidden]" hx-headers='{"X-Mx-Automatique": "1"}' hx-swap="outerHTML"{% if oob %} hx-swap-oob="true"{% endif %}>{% if non_lues %}<span class="mx-cloche__pastille" aria-hidden="true">{% if non_lues > 99 %}99+{% else %}{{ non_lues }}{% endif %}</span><span class="visually-hidden">{{ non_lues }} notification{{ non_lues|pluralize }} non lue{{ non_lues|pluralize }}</span>{% endif %}</span>
