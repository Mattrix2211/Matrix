<div id="ronde-progress" {% if oob %}hx-swap-oob="true"{% endif %} class="mb-3">
  <div class="d-flex justify-content-between small font-mono mb-1">
    <span>{{ repondus }} / {{ total }} points</span>
    <span><span class="mx-texte--ok">{{ conformes }} conformes</span> · <span class="mx-texte--danger">{{ non_conformes }} non conformes</span></span>
  </div>
  <div class="progress" style="height:10px;" title="Progression de la ronde : {{ pct }} %">
    {% if total %}
    <div class="progress-bar mx-resultat--conforme" style="width: {% widthratio conformes total 100 %}%;"></div>
    <div class="progress-bar mx-resultat--non-conforme" style="width: {% widthratio non_conformes total 100 %}%;"></div>
    {% endif %}
  </div>
</div>
