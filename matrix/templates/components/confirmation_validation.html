{# Confirmation explicite d'une validation critique (matrix/core/confirmations.py). Jamais pré-cochée ni conservée dans un brouillon. #}
<div class="mx-confirmation border rounded p-3 mb-2">
  <p class="small text-muted mb-2">Vous validez en tant que <strong>{{ valideur }}</strong>.</p>
  <div class="form-check">
    <input class="form-check-input" type="checkbox" name="confirmation" value="1" id="{{ ident }}" autocomplete="off" data-brouillon-ignorer>
    <label class="form-check-label" for="{{ ident }}">{{ texte }}</label>
  </div>
  {% if note %}<div class="form-text">{{ note }}</div>{% endif %}
</div>
