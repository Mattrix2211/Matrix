{% load composants %}

<nav class="nav nav-pills nav-fill small mb-3 mx-parcours" aria-label="Parcours du quotidien">
  <a class="nav-link{% if courante == 'quotidien' %} active{% endif %}" href="{% url 'home' %}" title="Mes tâches, mon calendrier et mes échéances">Mon quotidien</a>
  {% if request.user|peut_piloter_equipe %}
  <a class="nav-link{% if courante == 'equipe' %} active{% endif %}" href="{% url 'calendar-index' %}?user=equipe" title="Planning de l'équipe et attribution des tâches">Mon équipe</a>
  {% endif %}
  <a class="nav-link{% if courante == 'suivi' %} active{% endif %}" href="{% url 'demandes-index' %}" title="Difficultés signalées, fils de discussion et comptes rendus">Suivi</a>
  {% if request.user|peut_piloter_equipe %}
  <a class="nav-link{% if courante == 'synthese' %} active{% endif %}" href="{% url 'taches-index' %}#synthese" title="Avancement, blocages et décisions du chef">Synthèse</a>
  {% endif %}
