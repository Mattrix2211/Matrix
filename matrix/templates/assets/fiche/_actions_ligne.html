{% load icones %}<div class="btn-group btn-group-sm" role="group" aria-label="Actions sur la ligne">
  <button type="button" class="btn btn-outline-secondary" data-monter aria-label="Monter" title="Monter">{% icone "monter" %}</button>
  <button type="button" class="btn btn-outline-secondary" data-descendre aria-label="Descendre" title="Descendre">{% icone "descendre" %}</button>
  <button type="button" class="btn btn-outline-secondary" data-dupliquer aria-label="Dupliquer" title="Dupliquer">{% icone "dupliquer" %}</button>
  <button type="button" class="btn btn-outline-danger" data-retirer aria-label="Retirer" title="Retirer">{% icone "suppression" %}</button>
</div>
