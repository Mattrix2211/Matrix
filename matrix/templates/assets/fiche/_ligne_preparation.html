{% load icones %}<div class="row g-2 mb-2 align-items-end" data-ligne>
  <div class="col-md-3"><label class="form-label small">Nature</label>
    <select class="form-select form-select-sm" name="prep_type">{% for cle, libelle in types_preparation %}<option value="{{ cle }}"{% if p.type == cle %} selected{% endif %}>{{ libelle }}</option>{% endfor %}</select></div>
  <div class="col-md-4"><label class="form-label small">Libellé</label><input class="form-control form-control-sm" name="prep_libelle" value="{{ p.libelle }}"></div>
  <div class="col-md-1"><label class="form-label small">Qté</label><input class="form-control form-control-sm" type="number" min="1" name="prep_quantite" value="{{ p.quantite|default:1 }}"></div>
  <div class="col-md-3"><label class="form-label small">Pièce du stock</label>
    <select class="form-select form-select-sm" name="prep_piece"><option value="">—</option>{% for s in pieces %}<option value="{{ s.pk }}"{% if p.piece == s.pk %} selected{% endif %}>{{ s.designation }}</option>{% endfor %}</select></div>
  <div class="col-md-1"><button type="button" class="btn btn-sm btn-outline-danger" data-retirer aria-label="Retirer cette ligne" title="Retirer">{% icone "suppression" %}</button></div>
</div>
