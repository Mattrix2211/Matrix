      <div class="tab-pane fade" id="pane-parts" role="tabpanel">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h6 class="mb-0">Pièces</h6>
          <button class="btn btn-sm btn-primary" data-bs-toggle="modal" data-bs-target="#addPartModal">Ajouter</button>
        </div>
        <div class="table-responsive">
          <table class="table table-sm align-middle">
            <thead><tr><th>Désignation</th><th>NNO</th><th>Référence</th><th>Marque</th></tr></thead>
            <tbody>
              {% for p in parts %}
              <tr data-bs-toggle="modal" data-bs-target="#partDetailModal-{{ p.id }}" style="cursor:pointer;"><td>{{ p.name }}</td><td class="font-mono">{{ p.nno|default:"" }}</td><td class="font-mono">{{ p.reference|default:"" }}</td><td>{{ p.marque|default:"" }}</td></tr>
              {% empty %}
              <tr><td colspan="4" class="text-muted">Aucune pièce</td></tr>
              {% endfor %}
            </tbody>
          </table>
        </div>
      </div>
