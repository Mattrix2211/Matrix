<script>
(function(){
  function renderIsolationChart(){
    var el = document.getElementById('isolationChart');
    if (!el || !window.Chart) return;
    // si l'onglet est caché, attendre son affichage
    if (el.offsetParent === null) return;
    var labels = {{ isolation_chart_labels_json|safe }};
    var values = {{ isolation_chart_values_json|safe }};
    var seuil = {{ isolation_seuil_ohms|default:"null" }};
    var datasets = [{
      label: 'Isolement (Ω)',
      data: values,
      borderColor: '#0d6efd',
      backgroundColor: 'rgba(13,110,253,0.12)',
      tension: 0.1,
      pointRadius: 3,
      pointHoverRadius: 5,
      fill: true,
    }];
    // Ligne horizontale au seuil d'alerte (Installation.isolation_seuil_ohms) :
    // même valeur répétée sur toute la largeur, plus simple à maintenir qu'un
    // plugin Chart.js dédié pour une seule ligne constante.
    if (seuil !== null) {
      datasets.push({
        label: 'Seuil critique (Ω)',
        data: labels.map(function(){ return seuil; }),
        borderColor: '#dc3545',
        borderDash: [6, 4],
        pointRadius: 0,
        fill: false,
      });
    }
    var ctx = el.getContext('2d');
    if (el._chart) { el._chart.destroy(); }
    el._chart = new Chart(ctx, {
      type: 'line',
      data: { labels: labels, datasets: datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: seuil !== null },
          tooltip: {
            callbacks: {
              label: function(ctx){
                var v = ctx.parsed.y || 0; return ctx.dataset.label + ' : ' + (Math.round(v*100)/100) + ' Ω';
              }
            }
          }
        },
        scales: {
          x: { grid: { display: false } },
          y: {
            beginAtZero: true,
            grid: { color: 'rgba(0,0,0,0.08)' },
            ticks: {
              callback: function(value){ return value + ' Ω'; }
            }
          }
        }
      }
    });
  }
  // Planificateur de rendu fiable (gère transitions/ordre des scripts), même
  // logique que scheduleHoursRender (_script_graphique_heures.html).
  function scheduleIsolationRender(retries){
    var attempts = typeof retries === 'number' ? retries : 10;
    var el = document.getElementById('isolationChart');
    if (!el || !window.Chart) {
      if (attempts > 0) return setTimeout(function(){ scheduleIsolationRender(attempts-1); }, 100);
      return;
    }
    if (el.offsetParent === null) {
      if (attempts > 0) return setTimeout(function(){ scheduleIsolationRender(attempts-1); }, 150);
      return;
    }
    renderIsolationChart();
  }
  try {
    var isoTabBtn = document.querySelector('#tab-isolement');
    if (isoTabBtn && isoTabBtn.classList.contains('active')) {
      scheduleIsolationRender();
    }
  } catch(_){}
  document.addEventListener('shown.bs.tab', function(e){
    if (e.target && e.target.id === 'tab-isolement') scheduleIsolationRender();
  });
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function(){ scheduleIsolationRender(); });
  } else {
    scheduleIsolationRender();
  }
  window.addEventListener('load', function(){ scheduleIsolationRender(); });
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) scheduleIsolationRender(); });
})();
</script>
