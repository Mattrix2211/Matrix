      <!-- Onglet Entretien -->
      <div class="tab-pane fade" id="pane-entretien" role="tabpanel" aria-labelledby="tab-entretien">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h6 class="mb-0">Entretien</h6>
          <button class="btn btn-sm btn-primary" data-bs-toggle="modal" data-bs-target="#addMaintenanceModal">Ajouter</button>
        </div>
        <div class="table-responsive">
          <table class="table table-sm align-middle" id="maintenanceTable">
            <thead><tr><th style="width:160px;">Périodicité</th><th style="width:220px;">Titre</th><th>Description</th></tr></thead>
            <tbody>
              {% for m in maintenances %}
                <tr class="mnt-row" style="cursor:pointer;"
                    data-id="{{ m.id }}"
                    data-periodicity="{{ m.periodicity }}"
                    data-title="{{ m.title|default:'' }}"
                    data-description="{{ m.description|default:'' }}"
                    data-duration="{{ m.duration_hours|default:0 }} h {{ m.duration_minutes|default:0 }} min"
                    data-people="{{ m.people_count|default:'—' }}"
                    data-competence="{% if m.competence == 'BORD' %}Bord{% elif m.competence == 'SLM' %}SLM{% elif m.competence == 'INDUSTRIEL' %}Industriel{% else %}—{% endif %}">
                  <td>{{ m.periodicity }}</td>
                  <td>{{ m.title }}</td>
                  <td>{{ m.description|default:"" }}</td>
                </tr>
              {% empty %}
                <tr><td colspan="3" class="text-muted">Aucun entretien défini</td></tr>
              {% endfor %}
            </tbody>
          </table>
        </div>
      </div>
